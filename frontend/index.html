<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Downloader</title>
    <!-- Modern font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="blob-bg blob-1"></div>
    <div class="blob-bg blob-2"></div>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-cloud-arrow-down"></i> Model Downloader</h1>
            <p>Background downloading for heavy AI Models from HuggingFace & Civitai</p>
        </header>

        <section class="glass-panel" id="add-download-section">
            <div class="tabs">
                <button class="tab-btn active" data-target="download-form-container"><i
                        class="fa-solid fa-cloud-arrow-down"></i> Download URL</button>
                <button class="tab-btn" data-target="move-form-container"><i class="fa-solid fa-folder-tree"></i> Move
                    Local File</button>
            </div>

            <!-- Download Form -->
            <div id="download-form-container" class="tab-content active">
                <form id="download-form">
                    <div class="input-group">
                        <label for="url"><i class="fa-solid fa-link"></i> Model URL</label>
                        <input type="url" id="url" name="url"
                            placeholder="https://huggingface.co/... or https://civitai.com/..." required>
                    </div>

                    <div class="input-group">
                        <label for="destination"><i class="fa-solid fa-folder"></i> Destination Directory</label>
                        <div class="input-with-btn">
                            <input type="text" id="destination" name="destination" list="favorites-list"
                                placeholder="e.g. /mnt/hogehoge or models/downloads" value="models/downloads" required>
                            <button type="button" class="icon-btn" onclick="saveFavorite('destination')"
                                title="Save to Favorites"><i class="fa-solid fa-star"></i></button>
                        </div>
                    </div>

                    <button type="submit" class="primary-btn"><i class="fa-solid fa-download"></i> Start
                        Download</button>
                </form>
            </div>

            <!-- Move Form -->
            <div id="move-form-container" class="tab-content">
                <form id="move-form">
                    <div class="input-group">
                        <label for="source_path"><i class="fa-solid fa-file"></i> Local File Absolute Path</label>
                        <input type="text" id="source_path" name="source_path"
                            placeholder="C:\Downloads\model.safetensors" required>
                    </div>

                    <div class="input-group">
                        <label for="move_destination"><i class="fa-solid fa-folder-open"></i> Destination
                            Directory</label>
                        <div class="input-with-btn">
                            <input type="text" id="move_destination" name="move_destination" list="favorites-list"
                                placeholder="e.g. /mnt/hogehoge or models/downloads" value="models/downloads" required>
                            <button type="button" class="icon-btn" onclick="saveFavorite('move_destination')"
                                title="Save to Favorites"><i class="fa-solid fa-star"></i></button>
                        </div>
                    </div>

                    <button type="submit" class="primary-btn"><i class="fa-solid fa-truck-fast"></i> Move File</button>
                </form>
            </div>
        </section>

        <section class="downloads-container">
            <h2>Active & Recent Downloads</h2>
            <div id="downloads-list">
                <!-- Download items will be injected here by JS -->
                <div class="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading...</div>
            </div>
        </section>
    </div>

    <!-- Template for a download item -->
    <template id="download-item-template">
        <div class="download-item glass-panel">
            <div class="item-header">
                <div class="item-info">
                    <h3 class="filename">filename.safetensors</h3>
                    <span class="url">https://url.com</span>
                    <span class="destination badge">models/checkpoints</span>
                </div>
                <div class="item-actions">
                    <button class="resume-btn hidden" aria-label="Resume Download" title="Resume"><i
                            class="fa-solid fa-play"></i></button>
                    <button class="delete-btn" aria-label="Cancel or Delete" title="Cancel/Delete"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="status-indicator">
                <span class="status-badge status-pending">PENDING</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-stats">
                    <span class="percentage">0%</span>
                </div>
            </div>

            <div class="error-message"></div>
        </div>
    </template>

    <datalist id="favorites-list">
        <!-- Injected by JS -->
    </datalist>

    <script src="app.js"></script>
</body>

</html>
